<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acak Urutan Nama</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #10002b, #3c096c, #5a189a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Mencegah scroll default */
        }

        /* Container Utama */
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PAGE 1: SETUP */
        #setup-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #setup-page h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: #00ffff;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            color: white;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        textarea:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff007f, #ffaa00);
            border: none;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 127, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-primary:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 170, 0, 0.6);
        }

        .btn-primary:active {
            transform: scale(0.95);
        }

        /* PAGE 2: SPIN ANIMATION */
        #spin-page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .spinner-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: popInOut 3.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
        }

        @keyframes popInOut {
            0% { transform: scale(0); opacity: 0; }
            10% { transform: scale(1.1); opacity: 1; }
            15% { transform: scale(1); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            95% { transform: scale(1.1); opacity: 1; filter: brightness(2); }
            100% { transform: scale(0); opacity: 0; }
        }

        .spinning-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff007f, #ffaa00, #00ffff, #ff007f);
            animation: spinRing 0.3s linear infinite;
            mask-image: radial-gradient(transparent 58%, black 60%);
            -webkit-mask-image: radial-gradient(transparent 58%, black 60%);
            box-shadow: 0 0 50px rgba(255,0,127,0.5);
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .spin-text {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: white;
            text-shadow: 0 0 15px #00ffff;
            z-index: 1;
            padding: 20px;
            max-width: 90%;
            word-wrap: break-word;
        }

        /* PAGE 3: RESULTS */
        #result-page {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 90vh; /* Agar muat di layar dan bisa di-scroll */
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-title {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            margin: 0 0 20px 0;
            background: linear-gradient(45deg, #00ffff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .result-list-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Kustom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #ffaa00; border-radius: 4px; }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 6px solid #00ffff;
            opacity: 0;
            transform: translateX(-50px);
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 3 Teratas Dapat Warna Khusus (Emas, Perak, Perunggu) */
        .result-item:nth-child(1) { border-left-color: #ffd700; background: rgba(255, 215, 0, 0.15); font-size: 26px; }
        .result-item:nth-child(2) { border-left-color: #c0c0c0; background: rgba(192, 192, 192, 0.15); }
        .result-item:nth-child(3) { border-left-color: #cd7f32; background: rgba(205, 127, 50, 0.15); }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .rank {
            font-weight: 900;
            color: rgba(255,255,255,0.6);
            width: 35px;
            text-align: right;
        }

        .result-item:nth-child(1) .rank { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .result-item:nth-child(2) .rank { color: #c0c0c0; }
        .result-item:nth-child(3) .rank { color: #cd7f32; }

        .name {
            font-weight: 700;
            flex-grow: 1;
        }

        .btn-reset {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-reset:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        
        <!-- HALAMAN 1: SETUP -->
        <div id="setup-page">
            <h2>Masukkan Nama</h2>
            <textarea id="namesInput">Budi
Siti
Andi
Rina
Joko
Dewi
Agus
Fauzan</textarea>
            <button class="btn-primary" id="spinBtn">PUTAR!</button>
        </div>

        <!-- HALAMAN 2: ANIMASI PUTAR -->
        <div id="spin-page">
            <div class="spinner-wrapper">
                <div class="spinning-ring"></div>
                <div class="spin-text" id="spinText">MENGACAK...</div>
            </div>
        </div>

        <!-- HALAMAN 3: HASIL URUTAN -->
        <div id="result-page">
            <h1 class="result-title">Hasil Urutan</h1>
            <div class="result-list-container">
                <ul id="resultList">
                    <!-- Item akan ditambahkan lewat JS -->
                </ul>
            </div>
            <button class="btn-reset" id="resetBtn">Mulai Lagi</button>
        </div>

    </div>

    <script>
        const setupPage = document.getElementById('setup-page');
        const spinPage = document.getElementById('spin-page');
        const resultPage = document.getElementById('result-page');
        
        const spinBtn = document.getElementById('spinBtn');
        const resetBtn = document.getElementById('resetBtn');
        const namesInput = document.getElementById('namesInput');
        const spinText = document.getElementById('spinText');
        const resultList = document.getElementById('resultList');

        let rawNames = [];

        // Muat dari localStorage saat pertama kali halaman dibuka
        const savedNames = localStorage.getItem('savedWheelNames');
        if (savedNames) {
            namesInput.value = savedNames;
        }

        // Simpan setiap kali ada perubahan pada teks
        namesInput.addEventListener('input', () => {
            localStorage.setItem('savedWheelNames', namesInput.value);
        });

        spinBtn.addEventListener('click', () => {
            // Ambil nama dari input
            rawNames = namesInput.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (rawNames.length === 0) {
                alert("Tolong masukkan minimal 1 nama!");
                return;
            }

            // Ganti ke halaman animasi
            setupPage.style.display = 'none';
            spinPage.style.display = 'flex';

            // Animasi pergantian teks secara cepat di tengah lingkaran
            let flashInterval = setInterval(() => {
                const randomName = rawNames[Math.floor(Math.random() * rawNames.length)];
                spinText.innerText = randomName;
            }, 80);

            // Tunggu animasi popInOut CSS selesai (sekitar 3.5 detik)
            setTimeout(() => {
                clearInterval(flashInterval);
                tampilkanHasil();
            }, 3300);
        });

        function tampilkanHasil() {
            spinPage.style.display = 'none';
            resultPage.style.display = 'flex';

            // Acak urutan array menggunakan Fisher-Yates Shuffle
            let shuffled = [...rawNames];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // Bersihkan list sebelumnya
            resultList.innerHTML = '';

            // Masukkan elemen ke dalam list dengan jeda animasi (stagger)
            shuffled.forEach((name, i) => {
                const li = document.createElement('li');
                li.className = 'result-item';
                // Tambahkan jeda animasi agar munculnya satu-satu (menurun)
                li.style.animationDelay = `${i * 0.15}s`;
                li.innerHTML = `<span class="rank">#${i + 1}</span> <span class="name">${name}</span>`;
                resultList.appendChild(li);
            });

            // Tembakkan Confetti untuk merayakan
            fireConfetti();
        }

        resetBtn.addEventListener('click', () => {
            resultPage.style.display = 'none';
            setupPage.style.display = 'flex';
        });

        function fireConfetti() {
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 80,
                    origin: { x: 0 },
                    colors: ['#ff007f', '#ffaa00', '#00ffff']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 80,
                    origin: { x: 1 },
                    colors: ['#ff007f', '#ffaa00', '#00ffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
