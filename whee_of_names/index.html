<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wheel of Names — Acak Urutan Nama</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#111;--white:#fff;--off:#fdfdf7;--yellow:#ffd23f;--green:#2ecc71;--red:#ff4d4d;--blue:#3b82f6}
html,body{height:100%}
body{font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--off);background-image:radial-gradient(circle,#ddd 1.6px,transparent 1.6px);background-size:22px 22px;color:var(--black);display:flex;flex-direction:column;align-items:center;min-height:100vh}
.topbar{width:100%;text-align:center;padding:18px 0 6px;font-weight:900;letter-spacing:.14em;font-size:13px}
.container{width:min(860px,94vw);margin:0 auto;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0 28px}
.card{background:var(--white);border:4px solid var(--black);border-radius:22px;box-shadow:8px 8px 0 var(--black)}
.view{width:100%;display:none;flex-direction:column;align-items:center}
.view.active{display:flex}
.h1{font-weight:900;text-align:center;letter-spacing:.08em;line-height:1}
.h1-main{font-size:clamp(32px,6vw,56px)}
.h1-sub{font-size:clamp(14px,2.2vw,18px);margin-top:10px;letter-spacing:.18em}
.tagline{margin-top:12px;font-weight:700;font-size:13px;letter-spacing:.08em;opacity:.85;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--white);border:4px solid var(--black);border-radius:16px;box-shadow:6px 6px 0 var(--black);font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:16px 28px;font-size:clamp(14px,2vw,18px);cursor:pointer;user-select:none;transition:transform .08s,box-shadow .08s,background .12s;min-width:260px}
.btn:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--black)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--black)}
.btn.primary{background:var(--yellow)}
.btn.dark{background:var(--black);color:#fff}
.btn.small{min-width:160px;padding:12px 18px;font-size:14px;border-radius:14px}
.stack{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:18px}
.menu-card{width:min(560px,92vw);padding:34px 28px;text-align:center}
.pill{border:3px solid var(--black);border-radius:999px;padding:6px 14px;font-weight:900;font-size:12px;letter-spacing:.08em;background:var(--white);box-shadow:4px 4px 0 var(--black)}
.pill.yellow{background:var(--yellow)}
textarea{width:100%;height:200px;background:var(--off);border:4px solid var(--black);border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:var(--black);font-family:inherit;resize:vertical;outline:none;transition:box-shadow .12s;text-align:center;margin-top:18px}
textarea:focus{box-shadow:6px 6px 0 var(--black)}
.count-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.kbd-hint{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.7;margin-top:12px;text-align:center}
/* spin */
.spin-card{width:min(560px,92vw);padding:40px 28px;text-align:center;position:relative;overflow:hidden}
.spinner-ring{width:220px;height:220px;margin:18px auto 6px;border-radius:50%;border:6px solid var(--black);background:conic-gradient(from 0deg,var(--yellow),#ff9f1c,#ff4d4d,var(--yellow));animation:spinRing .5s linear infinite;mask-image:radial-gradient(transparent 58%,black 60%);-webkit-mask-image:radial-gradient(transparent 58%,black 60%);box-shadow:6px 6px 0 var(--black)}
@keyframes spinRing{to{transform:rotate(360deg)}}
.spin-text{font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:.06em;min-height:48px;margin-top:10px}
/* result */
.result-card{width:min(640px,94vw);padding:26px 20px}
.result-title{text-align:center;font-weight:900;font-size:clamp(24px,4vw,34px);letter-spacing:.08em}
.result-list-container{max-height:46vh;overflow-y:auto;margin-top:16px;padding:4px 4px 8px}
ul{list-style:none;display:flex;flex-direction:column;gap:12px}
.result-item{background:var(--white);border:3px solid var(--black);border-radius:14px;padding:12px 16px;font-size:18px;display:flex;align-items:center;gap:14px;box-shadow:4px 4px 0 var(--black);opacity:0;transform:translateX(-40px);animation:slideIn .4s cubic-bezier(.175,.885,.32,1.275) forwards}
.result-item:nth-child(1){background:var(--yellow);font-size:22px;font-weight:900}
.result-item:nth-child(2),.result-item:nth-child(3){background:#fff8d6}
@keyframes slideIn{to{opacity:1;transform:translateX(0)}}
.rank{font-weight:900;background:var(--black);color:#fff;border-radius:999px;min-width:44px;height:32px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.06em}
.name{font-weight:800;flex-grow:1;text-align:left;word-break:break-word}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;font-weight:900;font-size:13px;letter-spacing:.08em;padding:12px 20px;border-radius:999px;border:3px solid var(--black);box-shadow:4px 4px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.btn{min-width:200px}}
</style>
</head>
<body>
<div class="topbar">WHEEL OF NAMES</div>
<div class="container">
  <!-- SETUP -->
  <section id="view-setup" class="view active">
    <div class="card menu-card">
      <div class="h1 h1-main">WHEEL<br>OF NAMES</div>
      <div class="h1-sub">ACAK URUTAN NAMA</div>
      <div class="tagline">"Putar rodanya. Terima urutannya."</div>
      <textarea id="namesInput" placeholder="Tulis satu nama per baris...">Budi
Siti
Andi
Rina
Joko
Dewi
Agus
Fauzan</textarea>
      <div class="count-row">
        <div class="pill yellow" id="count-pill">0 NAMA</div>
        <button class="pill" id="btn-sample" style="cursor:pointer" type="button">✨ CONTOH</button>
        <button class="pill" id="btn-clear-names" style="cursor:pointer" type="button">🗑 HAPUS</button>
      </div>
      <div class="stack">
        <button class="btn primary" id="spinBtn">PUTAR!</button>
      </div>
      <div class="kbd-hint">ENTER Putar &nbsp;·&nbsp; Satu nama per baris</div>
    </div>
  </section>
  <!-- SPIN -->
  <section id="view-spin" class="view">
    <div class="card spin-card">
      <div class="pill yellow" style="display:inline-block">MENGACAK...</div>
      <div class="spinner-ring"></div>
      <div class="spin-text" id="spinText">...</div>
      <div class="kbd-hint">Tunggu rodanya berhenti...</div>
    </div>
  </section>
  <!-- RESULT -->
  <section id="view-result" class="view">
    <div class="card result-card">
      <div class="result-title">🏆 HASIL URUTAN</div>
      <div class="tagline" id="result-meta">8 NAMA • TERSIMPAN OTOMATIS</div>
      <div class="result-list-container"><ul id="resultList"></ul></div>
      <div class="btn-row">
        <button class="btn small primary" id="btn-copy">📋 SALIN</button>
        <button class="btn small" id="btn-reshuffle">🔀 ACAK LAGI</button>
        <button class="btn small dark" id="resetBtn">MULAI LAGI</button>
      </div>

    </div>
  </section>
</div>
<!--<div class="toast" id="toast">TERSALIN!</div>-->
<script>
const KEY_NAMES='savedWheelNames', KEY_RESULTS='savedWheelResults';
const $=id=>document.getElementById(id);
const views={setup:$('view-setup'),spin:$('view-spin'),result:$('view-result')};
const namesInput=$('namesInput'),spinText=$('spinText'),resultList=$('resultList'),countPill=$('count-pill'),toast=$('toast');
let rawNames=[];
function show(name){Object.values(views).forEach(v=>v.classList.remove('active'));views[name].classList.add('active')}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1800)}
function parseNames(){return namesInput.value.split('\n').map(n=>n.trim()).filter(Boolean)}
function updateCount(){const n=parseNames().length;countPill.textContent=n+' NAMA'}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// restore
const savedNames=localStorage.getItem(KEY_NAMES);
if(savedNames!==null) namesInput.value=savedNames;
updateCount();
namesInput.addEventListener('input',()=>{localStorage.setItem(KEY_NAMES,namesInput.value);updateCount()});
$('btn-clear-names').addEventListener('click',()=>{namesInput.value='';localStorage.setItem(KEY_NAMES,'');updateCount();namesInput.focus()});
$('btn-sample').addEventListener('click',()=>{namesInput.value='lele';localStorage.setItem(KEY_NAMES,namesInput.value);updateCount()});
// restore hasil spin agar tidak hilang saat refresh
try{
  const savedResults=JSON.parse(localStorage.getItem(KEY_RESULTS)||'null');
  if(Array.isArray(savedResults)&&savedResults.length){rawNames=parseNames();renderResults(savedResults,false);show('result')}
}catch(e){}
function doSpin(){
  rawNames=parseNames();
  if(!rawNames.length){alert('Tolong masukkan minimal 1 nama!');namesInput.focus();return}
  localStorage.setItem(KEY_NAMES,namesInput.value);
  show('spin');
  const iv=setInterval(()=>{spinText.innerText=rawNames[Math.floor(Math.random()*rawNames.length)]},80);
  setTimeout(()=>{clearInterval(iv);const s=shuffle(rawNames);localStorage.setItem(KEY_RESULTS,JSON.stringify(s));renderResults(s,true)},1800);
}
function renderResults(list,celebrate){
  resultList.innerHTML='';
  $('result-meta').textContent=list.length+' NAMA • TERSIMPAN OTOMATIS';
  list.forEach((name,i)=>{
    const li=document.createElement('li');li.className='result-item';li.style.animationDelay=(i*0.12)+'s';
    const safe=document.createElement('span');safe.className='name';safe.textContent=name;
    const rank=document.createElement('span');rank.className='rank';rank.textContent='#'+(i+1);
    li.appendChild(rank);li.appendChild(safe);resultList.appendChild(li);
  });
  show('result');
  if(celebrate&&window.confetti)fireConfetti();
}
$('spinBtn').addEventListener('click',doSpin);
$('btn-reshuffle').addEventListener('click',doSpin);
$('resetBtn').addEventListener('click',()=>{localStorage.removeItem(KEY_RESULTS);show('setup');namesInput.focus()});
$('btn-copy').addEventListener('click',async()=>{
  const saved=JSON.parse(localStorage.getItem(KEY_RESULTS)||'[]');
  if(!saved.length){showToast('BELUM ADA HASIL');return}
  const text=saved.map((n,i)=>(i+1)+'. '+n).join('\n');
  try{await navigator.clipboard.writeText(text);showToast('✓ '+saved.length+' NAMA TERSALIN!')}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('✓ '+saved.length+' NAMA TERSALIN!')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(document.activeElement===namesInput||views.setup.classList.contains('active'))&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();doSpin()}
});
function fireConfetti(){
  if(typeof confetti==='undefined')return;
  const end=Date.now()+2500;
  (function frame(){
    confetti({particleCount:6,angle:60,spread:70,origin:{x:0},colors:['#ffd23f','#111','#2ecc71']});
    confetti({particleCount:6,angle:120,spread:70,origin:{x:1},colors:['#ffd23f','#111','#ff4d4d']});
    if(Date.now()<end)requestAnimationFrame(frame);
  })();
}
</script>
</body>
</html>
