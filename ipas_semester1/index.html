        }

        }

        .absolute {

        }

        .transform {
            transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));

            text-decoration-line: underline;
        }

        .filter {
            filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
        }

        :root {
            --bg: #ffffff;
            --black: #000;
            --yellow: #ffd23f;
            --green: #22c55e;
            --red: #ff4d4d;
            --blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Outfit", sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }

        body {
            background: var(--bg);
            color: var(--black);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 16px 0 80px;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.5;
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 10;
            width: 96%;
            max-width: 1100px;
            text-align: center;
        }

        .screen {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .top-tag {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.18em;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .title {
            font-size: clamp(32px, 5.5vw, 58px);
            font-weight: 900;
            letter-spacing: 0.06em;
            line-height: 1;
        }

        .title span {
            background: var(--yellow);
            padding: 2px 12px;
            border: 3px solid var(--black);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--black);
            display: inline-block;
            transform: rotate(-1deg);
        }

        .subtitle {
            font-size: clamp(11px, 1.6vw, 14px);
            font-weight: 700;
            letter-spacing: 0.12em;
            color: #4b5563;
            margin-top: 10px;
        }

        .pills-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .pill-mini {
            border: 3px solid var(--black);
            border-radius: 999px;
            padding: 6px 14px;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 0.08em;
            background: #fff;
            box-shadow: 3px 3px 0 var(--black);
        }

        .pill-mini.yellow {
            background: var(--yellow);
        }

        .cards-container {
            display: flex;
            gap: 4vw;
            justify-content: center;
            padding: 2rem 1rem;
            flex-wrap: wrap;
        }

        .card-select {
            flex: 1;
            min-width: 280px;
            max-width: 560px;
            height: 42vh;
            min-height: 340px;
            background: #fff;
            border: 4px solid var(--black);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 12px 12px 0 var(--black);
            transition: all 0.2s ease;
        }

        .card-select:hover,
        .card-select.hover-sim {
            transform: translate(-6px, -6px);
            box-shadow: 18px 18px 0 var(--black);
            background: #f9fafb;
        }

        .card-select:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 var(--black);
        }

        .card-select h2 {
            font-size: clamp(36px, 5vw, 56px);
            font-weight: 900;
            line-height: 1;
        }

        .card-select .arab {
            font-family: "Scheherazade New", serif;
            font-size: 30px;
            margin-top: 8px;
            letter-spacing: 0.12em;
        }

        .card-select .desc {
            font-size: 13px;
            font-weight: 700;
            color: #6b7280;
            margin-top: 10px;
            max-width: 80%;
            line-height: 1.4;
        }

        .badge-card {
            position: absolute;
            top: 14px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.1em;
            border: 3px solid var(--black);
            background: var(--black);
            color: #fff;
        }

        .badge-card.yellow {
            background: var(--yellow);
            color: var(--black);
        }

        .card-select small {
            margin-top: 12px;
            font-size: 11px;
            letter-spacing: 0.08em;
            font-weight: 800;
            opacity: 0.6;
        }

        /* FLIP */
        .flip-wrapper {
            perspective: 1200px;
            width: min(900px, 98%);
            margin: 28px auto 0;
            overflow: visible;
            padding-top: 10px;
        }

        .flip-card {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.75s cubic-bezier(0.68, -0.35, 0.265, 1.55);
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            position: relative;
        }

        .face.back {
            position: absolute;
            inset: 0;
            transform: rotateY(180deg);
        }

        .question-box {
            background: #fff;
            border: 4px solid var(--black);
            border-radius: 24px;
            padding: 42px 18px 24px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 14px 14px 0 var(--black);
            overflow: visible;
            position: relative;
        }

        .type-badge {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 8px 22px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.12em;
            background: var(--black);
            color: #fff;
            border: 3px solid var(--black);
            white-space: nowrap;
            z-index: 5;
        }

        .type-badge.nun {
            background: var(--blue);
        }

        .type-badge.idzhar {
            background: #f59e0b;
            color: #000;
        }

        .ayat-arab {
            display: none !important;
        }

        .words {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
            direction: rtl;
        }

        .word {
            font-family: "Scheherazade New", serif;
            font-size: clamp(32px, 4.6vw, 48px);
            padding: 4px 10px;
            border-radius: 14px;
            border: 3px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: all 0.18s;
            direction: rtl;
            line-height: 1.8;
        }

        .word.ltr {
            font-family: "Outfit", sans-serif !important;
            direction: ltr !important;
            font-size: clamp(16px, 1.8vw, 20px) !important;
            font-weight: 700;
            background: #fff;
            border: 3px solid var(--black);
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            line-height: 1.45;
        }

        .word:hover {
            border-color: var(--black);
            transform: translateY(-2px);
            box-shadow: 4px 4px 0 var(--black);
        }

        .word.correct {
            border-color: var(--black);
            background: var(--green);
            color: #fff;
            box-shadow: 5px 5px 0 var(--black);
            animation: pop 0.35s ease;
        }

        .word.wrong {
            border-color: var(--red);
            background: #ffe4e6;
        }

        .word.highlight-nun {
            border-color: var(--black);
            background: var(--yellow);
            box-shadow: 4px 4px 0 var(--black);
            animation: pop 0.4s ease;
        }

        .word.highlight-idzhar {
            border-color: var(--black);
            background: var(--green);
            color: #fff;
            box-shadow: 4px 4px 0 var(--black);
            animation: pop 0.4s ease;
        }

        .word.dim {
            opacity: 0.35;
        }

        @keyframes pop {
            0% {
                transform: scale(0.92);
            }

            60% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .surah {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.1em;
            opacity: 0.6;
            margin-top: 10px;
        }

        .instr {
            display: none !important;
        }

        .instr.answer {
            background: var(--yellow);
            border-style: solid;
            border-color: var(--black);
        }

        .explain {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.5;
            opacity: 0.9;
            max-width: 700px;
        }

        .explain b {
            font-weight: 900;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn {
            padding: 13px 26px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 4px solid var(--black);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--black);
            transition: all 0.15s;
            background: #fff;
            font-family: "Outfit", sans-serif;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0 var(--black);
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--black);
        }

        .btn.primary {
            background: var(--yellow);
        }

        .btn.green {
            background: var(--green);
            color: #fff;
        }

        .controls-hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            z-index: 10;
            text-align: center;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 999px;
            border: 2px solid #e5e7eb;
        }

        kbd {
            background: #fff;
            padding: 2px 7px;
            border-radius: 6px;
            border: 2px solid #6b7280;
            font-family: monospace;
            color: #111;
            margin: 0 2px;
            font-weight: 900;
        }

        .spinning {
            animation: spinBlur 0.65s ease;
        }

        @keyframes spinBlur {
            0% {
                transform: rotateY(0) scale(1);
                filter: blur(0);
            }

            30% {
                transform: rotateY(180deg) scale(0.92);
                filter: blur(4px);
                opacity: 0.6;
            }

            60% {
                transform: rotateY(540deg) scale(1.02);
                filter: blur(2px);
            }

            100% {
                transform: rotateY(720deg) scale(1);
                filter: blur(0);
            }
        }

        .shake {
            animation: shake 0.3s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 24px;
        }

        .confetti i {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 900ms linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(500px) rotate(720deg);
            }
        }

        .progress {
            display: none !important;
        }

        .progress-bar {
            height: 100%;
            background: var(--black);
            width: 0;
            transition: width 0.4s;
        }

        @media (max-width: 700px) {
            .card-select {
                width: 92vw;
                min-height: 250px;
                height: 32vh;
            }

            .question-box {
                min-height: 400px;
                padding: 26px 12px;
            }

            .controls-hint {
                font-size: 10px;
                bottom: 6px;
            }
        }

        /* ===== Tambahan kecil untuk konten IPAS ===== */
        .shell {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .screen.active {
            animation: screenIn 0.35s ease;
        }

        @keyframes screenIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .soal-utama {
            font-size: clamp(22px, 3.2vw, 32px);
            font-weight: 800;
            line-height: 1.4;
            max-width: 780px;
            margin: 12px auto;
            direction: ltr;
            font-family: "Outfit", sans-serif;
        }

        .soal-utama.back {
            opacity: 0.7;
        }

        .words.ltr {
            direction: ltr !important;
            gap: 12px;
        }

        .instr.answer {
            display: inline-block !important;
            margin-top: 14px;
            padding: 10px 18px;
            border-width: 3px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.45;
            max-width: 92%;
        }

        .face.back .question-box {
            height: 100%;
        }

        #words-back:empty {
            display: none !important;
        }
    </style>
</head>
