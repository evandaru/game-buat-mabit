<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Light Green Light - Proyektor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            user-select: none;
        }

        #screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #status {
            font-size: clamp(4rem, 18vw, 12rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.1;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        #sub {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            margin-top: 20px;
            opacity: 0.9;
            font-weight: 600;
        }

        .green #screen {
            background: #1B5E20;
        }

        .red #screen {
            background: #B71C1C;
        }

        .idle #screen {
            background: #212121;
        }

        #stateImg {
            max-width: 80vw;
            max-height: 48vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            display: none;
            transition: transform 0.2s ease;
        }

        #startBtn {
            position: absolute;
            bottom: 40px;
            padding: 18px 48px;
            font-size: 1.6rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: #2196F3;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 #1565C0;
        }

        #startBtn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        #timer {
            position: absolute;
            top: 24px;
            font-size: 1.4rem;
            opacity: 0.7;
        }
    </style>
</head>

<body class="idle">
    <div id="screen">
        <img id="stateImg" src="" alt="Squid Game Visual">
        <div id="status">SIAP?</div>
        <div id="sub">Klik tombol untuk mulai</div>
    </div>

    <div id="timer"></div>
    <button id="startBtn">▶ MULAI PERMAINAN</button>

    <script>
        const body = document.body;
        const statusEl = document.getElementById('status');
        const subEl = document.getElementById('sub');
        const startBtn = document.getElementById('startBtn');
        const timerEl = document.getElementById('timer');
        const stateImg = document.getElementById('stateImg');

        // Preload gambar agar tidak patah/delay saat ganti fase
        const imgStart = new Image();
        imgStart.src = 'img/start.jpg';
        const imgStop = new Image();
        imgStop.src = 'img/stop.jpg';

        let isPlaying = false;
        let switchTimer = null;
        let startTime = 0;
        let timerInterval = null;

        // --- PENGATURAN DURASI (DALAM MILIDETIK) ---
        // Hijau: 20 sampai 35 detik (waktu menyusun sedotan)
        function greenDelay() {
            return 20000 + Math.random() * 15000;
        }

        // Merah: 8 sampai 15 detik (waktu diam / freeze)
        function redDelay() {
            return 8000 + Math.random() * 7000;
        }

        // --- AUDIO EFEK ---
        const startSound = new Audio('sound/start.mp3');
        const stopSound = new Audio('sound/stop.mp3');
        startSound.volume = 0.5; // Menyesuaikan volume start agar suara stop terasa jauh lebih kencang

        let audioCtx = null;
        let stopGainNode = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const stopSource = audioCtx.createMediaElementSource(stopSound);
                    stopGainNode = audioCtx.createGain();
                    stopGainNode.gain.value = 3.5; // Boost volume stop hingga 3.5x (350%)
                    stopSource.connect(stopGainNode);
                    stopGainNode.connect(audioCtx.destination);
                } catch (e) {
                    console.log('Web Audio setup error:', e);
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playStartSound() {
            initAudio();
            stopSound.pause();
            stopSound.currentTime = 0;
            startSound.currentTime = 0;
            startSound.play().catch(e => console.log('Audio play error:', e));
        }

        function playStopSound() {
            initAudio();
            startSound.pause();
            startSound.currentTime = 0;
            stopSound.currentTime = 0;
            stopSound.play().catch(e => console.log('Audio play error:', e));
        }

        function setGreen() {
            body.className = 'green';
            statusEl.textContent = 'GASSS';
            subEl.textContent = 'OTW NIHH BOSSS😂';

            stateImg.src = 'img/start.jpg';
            stateImg.style.display = 'block';

            // Mainkan suara Start
            playStartSound();

            // Jadwalkan kapan ganti ke MERAH
            scheduleNext(greenDelay(), setRed);
        }

        function setRed() {
            body.className = 'red';
            statusEl.textContent = 'DIAMMM';
            subEl.textContent = 'AWAS KAKI SAYA SAKIT😭';

            stateImg.src = 'img/stop.jpg';
            stateImg.style.display = 'block';

            // Mainkan suara Stop
            playStopSound();

            // Jadwalkan kapan ganti ke HIJAU
            scheduleNext(redDelay(), setGreen);
        }

        function scheduleNext(delay, nextFunction) {
            clearTimeout(switchTimer);
            switchTimer = setTimeout(() => {
                if (!isPlaying) return;
                nextFunction();
            }, delay);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const s = String(elapsed % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
        }

        function startGame() {
            isPlaying = true;
            startBtn.style.display = 'none';
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            updateTimer();

            // Mulai langsung dengan fase Hijau
            setGreen();
        }

        function stopGame() {
            isPlaying = false;
            clearTimeout(switchTimer);
            clearInterval(timerInterval);
            startSound.pause();
            startSound.currentTime = 0;
            stopSound.pause();
            stopSound.currentTime = 0;
            stateImg.style.display = 'none';
            body.className = 'idle';
            statusEl.textContent = 'SELESAI';
            subEl.textContent = 'Tekan F5 untuk mulai ulang';
            startBtn.style.display = 'none';
        }

        startBtn.addEventListener('click', startGame);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isPlaying) {
                stopGame();
            }
        });
    </script>
</body>

</html>
